[package]
name = "g360-db-ventas"
version = "0.1.0"
edition = "2021"
authors = ["Carlos Cusi <ccusi@g360.pe>"]
description = "Captura automática de ventas del intranet CIPSA -> SQLite local + Supabase"
license = "MIT"

[dependencies]
headless_chrome = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
csv = "1"
calamine = "0.26"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "sqlite"] }
dirs = "5"
url = "2"
anyhow = "1"
futures-util = "0.3"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[[bin]]
name = "batch"
path = "src/bin/batch_capture.rs"

[[bin]]
name = "upload"
path = "src/bin/upload.rs"

[[bin]]
name = "query"
path = "src/bin/query.rs"

[[bin]]
name = "recapture"
path = "src/bin/recapture.rs"
